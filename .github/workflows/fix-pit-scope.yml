name: Fix PIT scope bug

on:
  push:
    paths:
      - '.github/workflows/fix-pit-scope.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.py safely
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          old_sig = '''def prepare_pit_inputs(
              requested_start: date,
              requested_end: date,
              benchmark_ticker: str | None = None,
          ):'''
          new_sig = '''def prepare_pit_inputs(
              requested_start: date,
              requested_end: date,
              benchmark_ticker: str | None = None,
              sector_lookup: dict[str, str] | None = None,
          ):'''
          if old_sig not in s:
              raise SystemExit('prepare_pit_inputs signature not found')
          s = s.replace(old_sig, new_sig, 1)

          old_sector = '    sectors = {t: sector_map.get(t, "Unknown") for t in pit.tickers}'
          new_sector = '    sector_lookup = sector_lookup or {}\n    sectors = {t: sector_lookup.get(t, "Unknown") for t in pit.tickers}'
          if old_sector not in s:
              raise SystemExit('sector_map lookup not found')
          s = s.replace(old_sector, new_sector, 1)

          old_bt = '''                        bt_start, bt_end, benchmark_ticker
                    )'''
          new_bt = '''                        bt_start, bt_end, benchmark_ticker, sector_map
                    )'''
          if old_bt not in s:
              raise SystemExit('backtest PIT call not found')
          s = s.replace(old_bt, new_bt, 1)

          old_research = '''                        research_start, research_end, research_benchmark
                    )'''
          new_research = '''                        research_start, research_end, research_benchmark, sector_map
                    )'''
          if old_research not in s:
              raise SystemExit('research PIT call not found')
          s = s.replace(old_research, new_research, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate syntax
        run: python -m py_compile app.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Fix PIT sector scope on Streamlit Cloud"
          git push
